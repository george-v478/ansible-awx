- name: Collect host info
  hosts: all
  gather_facts: False

  vars:
    one: "ONE"
    two: "TWO"
  
  tasks:

  - name: Run command and return hostname
    command: echo "{{ one }}"
    register: remote_out
    delegate_to: 10.0.2.5

  - name: Run command and return hostname
    command: echo "{{ one }}"
    register: local_out

  - debug: 
      msg
        - "Local: {{ local_out.stdout }}"
        - "Remote: {{ remote_out.stdout }}"
